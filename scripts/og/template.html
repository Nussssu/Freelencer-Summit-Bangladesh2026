<!doctype html>
<!-- Share card template. Regenerate: npm run build, copy to public/, serve the app, screenshot /og-template.html at 1200x630 to public/og-image.png, delete the copy. Font file names are build hashes. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:BS;src:url(/build/assets/big-shoulders-latin-wght-normal-D2Rs5vCJ.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:HG;src:url(/build/assets/host-grotesk-latin-wght-normal-CBa0fl4q.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:JM;src:url(/build/assets/jetbrains-mono-latin-wght-normal-B9CIFXIH.woff2) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#050E0A url(/media/delta-flow-poster.jpg) right -120px center/auto 120% no-repeat;color:#F2ECDF;font-family:HG;position:relative;overflow:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#050E0A 38%,rgba(5,14,10,.6) 70%,rgba(5,14,10,0))}
.wrap{position:absolute;inset:56px 64px;display:flex;flex-direction:column}
.eyebrow{font-family:JM;font-size:18px;letter-spacing:.08em;color:#7FE0C8;text-transform:uppercase}
h1{font-family:BS;font-weight:900;text-transform:uppercase;font-size:120px;line-height:.86;margin-top:20px}
h1 span{display:block}.o{color:transparent;-webkit-text-stroke:2px #F2ECDF}
.stitch{margin-top:28px;width:420px;height:6px;background:repeating-linear-gradient(90deg,#E9B949 0 12px,transparent 12px 20px)}
.foot{margin-top:auto;display:flex;gap:16px;align-items:center;font-family:JM;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.chip{border:1px solid rgba(242,236,223,.3);padding:8px 12px}.gold{background:#E9B949;color:#050E0A;border-color:#E9B949}
.dot{position:absolute;right:64px;top:56px;font-family:BS;font-weight:900;font-size:64px;color:#E9B949}
</style></head><body><div class="shade"></div><div class="dot">'26</div><div class="wrap">
<p class="eyebrow">National flagship · 8 divisions · 12 districts · 100 campuses</p>
<h1><span>Freelancer</span><span class="o">Summit</span><span>Bangladesh</span></h1>
<div class="stitch"></div>
<div class="foot"><span class="chip gold">Late Nov 2026</span><span class="chip">Dhaka, Bangladesh</span><span class="chip">#FreelancerSummitBD</span></div>
</div></body></html>
